server:
  port: 8085

spring:
  application:
    name: kb-statistics
  profiles:
    active: dev

  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kb_statistics?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Nacos 服务注册与发现
  cloud:
    nacos:
      config:
        namespace: knowledge
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        group: KNOWLEDGE_BASE
        enabled: true
        username: nacos
        password: 123456
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: knowledge
        group: ${COMPUTER_ID:${USER:default}}
        username: nacos
        password: 123456
        ip: 127.0.0.1
  # Nacos 配置
  config:
    import: optional:nacos:kb-statistics-dev.yaml

  # Redis配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 2
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms
          time-between-eviction-runs: 30s

  # RabbitMQ配置
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: 123456
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.knowledge.base.statistics.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false

# 日志配置
logging:
  level:
    com.knowledge.base: debug
    org.springframework: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
