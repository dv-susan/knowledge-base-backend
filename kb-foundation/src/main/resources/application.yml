server:
  port: 8089

spring:
  application:
    name: kb-foundation

  # Nacos 服务注册与发现
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: knowledge
        group: ${COMPUTER_ID:${USER:default}}
        username: nacos
        password: 123456
        ip: 127.0.0.1

  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kb_foundation?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: admin

  # Redis配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 2
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: 3000ms
          max-idle: 10
          min-idle: 5
          time-between-eviction-runs: 30s

  # RabbitMQ配置
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: 123456
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Cache配置
  cache:
    type: redis
    redis:
      time-to-live: 600000

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.knowledge.base.foundation.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: INFO
    com.knowledge.base: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# JWT安全配置
security:
  jwt:
    exclude-paths: >
      /ws/**,
      /public/**,
      /actuator/**,
      /doc.html,
      /swagger-resources/**,
      /v3/api-docs/**,
      /webjars/**,
      /favicon.ico

# Swagger配置
knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false

# JWT配置（需与 kb-user-auth 密钥一致）
jwt:
  secret: knowledge-base-secret-key-for-jwt-token-generation-must-be-long-enough
  expiration: 7200000
  issuer: knowledge-base

# WebSocket配置
websocket:
  enabled: true
  path: /ws/notification
  allowed-origins: "*"

# kb-user-auth 服务直连地址（本地开发时使用，留空则通过 Nacos 服务发现）
kb-user-auth:
  url: http://localhost:8081

# 通知配置
notification:
  retention-days: 90
  batch-size: 100
